services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: yresonance
      POSTGRES_PASSWORD: yresonance
      POSTGRES_DB: yresonance
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres18:/var/lib/postgresql
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yresonance']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres18:
