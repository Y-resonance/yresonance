name: Release

# Publishes @yresonance-dev/core to npm when a version tag such as v0.2.0 is pushed.
# npm trusts this workflow file by name (trusted publishing), so there is no npm token.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # GitHub-hosted on purpose: npm trusted publishing does not accept other runners.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yresonance
          POSTGRES_PASSWORD: yresonance
          POSTGRES_DB: yresonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yresonance"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run test:package
      # The tag is the version; package.json in the repository stays at 0.0.0.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      # Bun cannot publish through trusted publishing. `prepack` builds the package files.
      - run: npm publish
