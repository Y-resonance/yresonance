name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - name: Check generated routes
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "src/routeTree.gen.ts is out of date. Run 'bun run generate-routes' and commit the result."
            exit 1
          fi
      - run: bun run check
      - uses: docker/setup-buildx-action@v3
      # The only Vite production build in this pipeline; the dry run reads its output.
      - run: bun run build
      - name: Validate the deployment package
        run: bun run deploy:dry-run

  integration:
    name: Worker integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  browser-ui:
    name: UI tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test:e2e:ui --shard=${{ matrix.shard }}/2
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # Forks never receive the Clerk secrets, so the job would fail for reasons a contributor
    # cannot act on.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Collect the Clerk development instance configuration
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: |
          missing=()
          [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ] || missing+=("repository variable VITE_CLERK_PUBLISHABLE_KEY")
          [ -n "$CLERK_SECRET_KEY" ] || missing+=("repository secret CLERK_SECRET_KEY")
          [ -n "$E2E_CLERK_USER_USERNAME" ] || missing+=("repository secret E2E_CLERK_USER_USERNAME")
          [ -n "$E2E_CLERK_USER_PASSWORD" ] || missing+=("repository secret E2E_CLERK_USER_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "The browser suite needs a Clerk development instance. Configure:"
            printf '  - %s\n' "${missing[@]}"
            echo "The test user needs a +clerk_test email address and a Clerk organization."
            exit 1
          fi
          # The dev server reads Worker secrets from .env.local, which is never committed.
          {
            echo "VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY"
            echo "CLERK_SECRET_KEY=$CLERK_SECRET_KEY"
            echo "CLERK_TELEMETRY_DISABLED=1"
          } > .env.local
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate:local
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test:e2e:clerk
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  analytics-backends:
    name: DuckDB and ClickHouse parity
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.16.41
        env:
          CLICKHOUSE_USER: yresonance_test
          CLICKHOUSE_PASSWORD: conformance_test_only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: yresonance_test
      CLICKHOUSE_PASSWORD: conformance_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:clickhouse
