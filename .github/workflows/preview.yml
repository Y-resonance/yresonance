name: Preview cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed PR number to retry cleanup for
        required: true
        type: string

      diagnose:
        description: Only check preview Postgres and Hyperdrive access (no cleanup)
        type: boolean
        default: false

      use_selected_ref:
        description: Run manual recovery using the selected ref instead of main
        type: boolean
        default: false

      preview_url:
        description: Run authenticated smoke tests against this branch-preview URL (no cleanup)
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

# Never interrupt cleanup. The helper waits for Cloudflare builds on the closed branch.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      YRESONANCE_PREVIEW_URL: ${{ inputs.preview_url }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --only-shell chromium
      - name: Verify the deployed branch preview
        run: bunx playwright test --config tests/e2e/playwright.preview.config.ts

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose && inputs.preview_url == ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_HYPERDRIVE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_API_TOKEN }}
      POSTGRES_PREVIEW_URL: ${{ secrets.POSTGRES_PREVIEW_URL }}
    steps:
      # Explicit diagnostics use the selected ref so fixes can be checked before merging.
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check preview access without changing resources
        run: bun run cloud/scripts/preview-resources.ts diagnose preview-diagnostics

  cleanup:
    if: (github.event_name == 'workflow_dispatch' && !inputs.diagnose && inputs.preview_url == '') || (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_HYPERDRIVE_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 17c619232f5d84567cd69896e892f326
      CLOUDFLARE_WORKER_TAG: ${{ vars.CLOUDFLARE_WORKER_TAG }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      POSTGRES_PREVIEW_URL: ${{ secrets.POSTGRES_PREVIEW_URL }}
      CLICKHOUSE_PREVIEW_URL: ${{ secrets.CLICKHOUSE_PREVIEW_URL }}
      CLICKHOUSE_PREVIEW_USER: ${{ secrets.CLICKHOUSE_PREVIEW_USER }}
      CLICKHOUSE_PREVIEW_PASSWORD: ${{ secrets.CLICKHOUSE_PREVIEW_PASSWORD }}
      CLICKHOUSE_PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.CLICKHOUSE_PREVIEW_ACCESS_CLIENT_ID }}
      CLICKHOUSE_PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.CLICKHOUSE_PREVIEW_ACCESS_CLIENT_SECRET }}
    steps:
      # Automatic cleanup always uses trusted base-branch code. Manual recovery may opt in
      # to a reviewed fix before it has merged; the closed-PR ownership check still applies.
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.use_selected_ref && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: bun install --frozen-lockfile
      - name: Verify this repository owns the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state == "closed" and .head.repo.full_name == .base.repo.full_name')" = true
      - name: Find the closed PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          echo "PREVIEW_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Delete native Preview and isolated data resources
        run: bun run cloud/scripts/preview-resources.ts cleanup "$PREVIEW_BRANCH"
      - name: Delete legacy PR previews
        run: bun run cloud/scripts/preview-resources.ts cleanup-legacy "$PR_NUMBER"
