name: Preview cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed PR number to retry cleanup for
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Never interrupt cleanup. The helper waits for Cloudflare builds on the closed branch.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 17c619232f5d84567cd69896e892f326
      CLOUDFLARE_WORKER_TAG: ${{ vars.CLOUDFLARE_WORKER_TAG }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      CLICKHOUSE_PREVIEW_URL: ${{ secrets.CLICKHOUSE_PREVIEW_URL }}
      CLICKHOUSE_PREVIEW_USER: ${{ secrets.CLICKHOUSE_PREVIEW_USER }}
      CLICKHOUSE_PREVIEW_PASSWORD: ${{ secrets.CLICKHOUSE_PREVIEW_PASSWORD }}
      CLICKHOUSE_PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.CLICKHOUSE_PREVIEW_ACCESS_CLIENT_ID }}
      CLICKHOUSE_PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.CLICKHOUSE_PREVIEW_ACCESS_CLIENT_SECRET }}
    steps:
      # Cleanup uses trusted base-branch code even when the closed PR contained broken code.
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Verify this repository owns the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state == "closed" and .head.repo.full_name == .base.repo.full_name')" = true
      - name: Find the closed PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          echo "PREVIEW_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Delete native Preview and isolated data resources
        run: bun run scripts/preview-resources.ts cleanup "$PREVIEW_BRANCH"
      - name: Delete legacy PR previews
        run: bun run scripts/preview-resources.ts cleanup-legacy "$PR_NUMBER"
